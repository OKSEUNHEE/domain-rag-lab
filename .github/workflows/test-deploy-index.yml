name: TEST — Deploy index.html to nginx

# 별도 테스트용 워크플로우입니다. ci.yml / cd.yml 과 독립적으로 동작하며,
# 루트의 index.html 한 파일만 domain-rag 서버의 nginx 폴더로 복사합니다.

on:
  push:
    branches: ["**"]
    paths:
      - "index.html"
  workflow_dispatch:

jobs:
  deploy-index:
    name: Copy index.html to nginx folder
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          TEST_EC2_SSH_PRIVATE_KEY: ${{ secrets.TEST_EC2_SSH_PRIVATE_KEY }}
          TEST_EC2_HOST: ${{ secrets.TEST_EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$TEST_EC2_SSH_PRIVATE_KEY" > ~/.ssh/test-deploy-index.pem
          chmod 600 ~/.ssh/test-deploy-index.pem
          ssh-keyscan -H "$TEST_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Ensure nginx folder exists
        env:
          TEST_EC2_HOST: ${{ secrets.TEST_EC2_HOST }}
          TEST_EC2_USER: ${{ secrets.TEST_EC2_USER }}
          TEST_EC2_NGINX_DIR: ${{ secrets.TEST_EC2_NGINX_DIR }}
        run: |
          ssh -i ~/.ssh/test-deploy-index.pem "$TEST_EC2_USER@$TEST_EC2_HOST" \
            "mkdir -p '$TEST_EC2_NGINX_DIR'"

      - name: Copy index.html to nginx folder
        env:
          TEST_EC2_HOST: ${{ secrets.TEST_EC2_HOST }}
          TEST_EC2_USER: ${{ secrets.TEST_EC2_USER }}
          TEST_EC2_NGINX_DIR: ${{ secrets.TEST_EC2_NGINX_DIR }}
        run: |
          scp -i ~/.ssh/test-deploy-index.pem \
            index.html \
            "$TEST_EC2_USER@$TEST_EC2_HOST:$TEST_EC2_NGINX_DIR/index.html"
