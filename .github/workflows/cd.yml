name: CD — ECR & EC2 Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: domain-rag-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Push to ECR and Deploy to EC2
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Building and pushing API image to ECR..."
          docker build -t $REGISTRY/domain-rag-lab-api:latest .
          docker push $REGISTRY/domain-rag-lab-api:latest

          echo "Building and pushing Streamlit image to ECR..."
          docker build -t $REGISTRY/domain-rag-lab-streamlit:latest .
          docker push $REGISTRY/domain-rag-lab-streamlit:latest

      - name: Configure SSH Key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || secrets.TEST_EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.TEST_EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy docker-compose.ecr.yml to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.TEST_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || secrets.TEST_EC2_USER }}
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.ecr.yml $EC2_USER@$EC2_HOST:/home/$EC2_USER/domain-rag-lab/docker-compose.ecr.yml

      - name: Pull ECR Images and Restart Stack on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || secrets.TEST_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || secrets.TEST_EC2_USER }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST <<EOF
          set -euo pipefail
          cd /home/$EC2_USER/domain-rag-lab
          
          echo "Logging into ECR on EC2..."
          aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $REGISTRY
          
          echo "Cleaning up disk space before pull..."
          sudo docker image prune -f || true
          
          echo "Pulling latest ECR images..."
          sudo docker compose -f docker-compose.ecr.yml --env-file .env.local pull
          
          echo "Restarting containers..."
          sudo docker compose -f docker-compose.ecr.yml --env-file .env.local up -d
          sudo docker compose -f docker-compose.ecr.yml --env-file .env.local ps
          
          echo "Cleaning up dangling images..."
          sudo docker image prune -f || true
          
          echo "Running health check..."
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:8300/health
          EOF
